<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>INFO</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0f14; --ink:#e9edf5; --body:#c4ccda; --muted:#7f8a9d;
    --pri:#c9a227; --line:rgba(255,255,255,.14); --card:rgba(255,255,255,.045);
    --fam:'Noto Sans KR',sans-serif; --w:640px; --dim:.55;
  }
  body.light{ --bg:#f6f5f2; --ink:#1c1e22; --body:#3d424b; --muted:#7b8290;
              --line:rgba(0,0,0,.14); --card:rgba(0,0,0,.035); }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--body);font-family:var(--fam);
    font-size:15px;line-height:1.9;-webkit-text-size-adjust:100%}
  #bgphoto{position:fixed;inset:0;z-index:-2;background-size:cover;background-position:center}
  #bgshade{position:fixed;inset:0;z-index:-1;background:var(--bg);opacity:var(--dim)}
  a{color:inherit}
  .hidden{display:none!important}
  .wrap{max-width:var(--w);margin:0 auto;padding:0 22px 90px}

  /* 머리 */
  .hero{position:relative;min-height:var(--hh,220px);display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:64px 22px 30px;overflow:hidden}
  .hero .ph{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.5}
  .hero .in{position:relative}
  .hero .ov{font-family:'IBM Plex Mono',monospace;font-size:9px;letter-spacing:.34em;
    color:var(--muted);margin:0 0 12px}
  .hero h1{margin:0;font-size:27px;font-weight:400;color:var(--ink);letter-spacing:.04em;line-height:1.35}
  .hero p.sb{margin:10px 0 0;font-size:12.5px;color:var(--muted)}

  /* 장 */
  .ch{position:relative;padding:30px 0 4px}
  .ch h2{margin:0 0 18px;font-size:19px;font-weight:500;color:var(--ink);letter-spacing:.01em;padding-right:74px}
  .ch .bd{font-size:15px;line-height:2}
  .ch .bd p{margin:0 0 16px}
  .ch .bd img{max-width:100%;border-radius:8px;display:block;margin:0 0 16px}
  .ch .bd b{color:var(--ink)}
  .ch .bd hr{border:none;border-top:1px solid var(--line);margin:26px 0}
  .ch .bd hr.hr-b{border-top:3px double var(--line)}
  .ch .bd hr.hr-dot{border-top:1px dotted var(--line)}
  .ch .bd blockquote{margin:0 0 16px;padding:2px 0 2px 15px;border-left:2px solid var(--pri)}
  .ch .bd mark{background:color-mix(in srgb,var(--pri) 30%,transparent);color:inherit;padding:0 2px}
  .ch .bd .al-c{text-align:center} .ch .bd .al-r{text-align:right}
  .ch .bd .al-j{text-align:justify} .ch .bd .ind{padding-left:1.4em}
  .ch .bd ul,.ch .bd ol{margin:0 0 16px;padding-left:1.3em}
  .ch .bd .ext-link{color:var(--pri)}
  .ch .bd .yt-wrap{position:relative;padding-top:56.25%;margin:0 0 16px}
  .ch .bd .yt-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:8px}
  details.fold{border:1px solid var(--line);border-radius:10px;background:var(--card);
    padding:12px 15px;margin:0 0 16px}
  details.fold summary{cursor:pointer;list-style:none;color:var(--pri);font-size:14px}
  details.fold summary::-webkit-details-marker{display:none}
  details.fold summary::before{content:'▸ '}
  details.fold[open] summary::before{content:'▾ '}
  details.fold .fold-in{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}

  /* 넘김 */
  .nav{display:flex;justify-content:center;align-items:center;gap:9px;margin:40px 0 0;flex-wrap:wrap}
  .nav .ar{cursor:pointer;font-size:16px;line-height:1.4;padding:3px 15px;color:var(--body);
    border:1px solid var(--line);border-radius:999px;user-select:none}
  .nav .ar.off{opacity:.2;pointer-events:none}
  .nav .ct{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.18em;
    color:var(--muted);min-width:56px;text-align:center}
  .nav .pl{cursor:pointer;font-size:12px;padding:5px 13px;color:var(--muted);
    border:1px solid var(--line);border-radius:999px}
  .nav .pl.on{color:var(--pri);border-color:var(--pri)}
  .nav .dt{cursor:pointer;width:8px;height:8px;border-radius:50%;background:var(--line)}
  .nav .dt.on{background:var(--pri)}

  /* 주인 도구 */
  .own{position:absolute;top:30px;right:0;display:flex;gap:11px}
  .own i{font-style:normal;font-size:13px;color:var(--muted);cursor:pointer}
  .own i:hover{color:var(--pri)}
  .own i.off{opacity:.2;pointer-events:none}
  .obar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;
    margin:38px 0 0;padding:18px 0 0;border-top:1px dashed var(--line)}
  .obar button{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.15em;
    cursor:pointer;background:none;color:var(--muted);border:1px solid var(--line);
    border-radius:999px;padding:7px 14px}
  .obar button:hover{color:var(--pri);border-color:var(--pri)}
  .obar .nt{width:100%;text-align:center;font-size:11px;color:var(--muted);margin:10px 0 0}
  .empty{text-align:center;color:var(--muted);padding:40px 0;font-size:13px}

  /* 시트(꾸미기·편집 공용) */
  .sheet{position:fixed;inset:0;z-index:60;background:rgba(4,5,8,.62);
    display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}
  .sheet .card{width:100%;max-width:720px;max-height:92vh;overflow:auto;
    background:var(--bg);border:1px solid var(--line);border-bottom:none;
    border-radius:16px 16px 0 0;padding:18px 20px 30px}
  .sheet h3{margin:0 0 2px;font-size:14px;font-weight:500;color:var(--ink)}
  .sheet .sub{margin:0 0 16px;font-size:11px;color:var(--muted)}
  .sheet .x{float:right;cursor:pointer;color:var(--muted);font-size:15px;padding:0 2px}
  .stabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .stabs b{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.15em;font-weight:400;
    cursor:pointer;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px}
  .stabs b.on{color:var(--pri);border-color:var(--pri)}
  .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .row label{font-size:11px;color:var(--muted)}
  input[type=text],input[type=url],select,textarea{background:var(--card);color:var(--ink);
    border:1px solid var(--line);border-radius:9px;padding:9px 11px;font:inherit;font-size:13px;
    width:100%;min-width:0}
  .row input[type=text],.row select{flex:1}
  input[type=color]{width:40px;height:30px;padding:2px;background:none;
    border:1px solid var(--line);border-radius:8px}
  input[type=range]{flex:1;accent-color:var(--pri)}
  textarea{min-height:120px;resize:vertical;line-height:1.8}
  #ed-body{min-height:44vh;font-size:14px}
  .btn{font-size:12px;cursor:pointer;background:none;color:var(--body);
    border:1px solid var(--line);border-radius:999px;padding:7px 15px;white-space:nowrap}
  .btn:hover{border-color:var(--pri);color:var(--pri)}
  .btn.go{background:var(--pri);border-color:var(--pri);color:#15130c;font-weight:500}
  .filelab{font-size:11px;color:var(--muted);border:1px dashed var(--line);
    border-radius:9px;padding:8px 12px;cursor:pointer}
  .filelab input{display:none}
  .note{font-size:11px;color:var(--muted);margin:2px 0 14px;line-height:1.7}
  .fmtbar{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
  .fmtbar button{font-size:12px;cursor:pointer;background:var(--card);color:var(--body);
    border:1px solid var(--line);border-radius:7px;padding:5px 10px;min-width:32px}
  .fmtbar button:hover{color:var(--pri)}

  #toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
    background:rgba(12,14,18,.94);color:#eef2f8;border:1px solid var(--line);
    border-radius:999px;padding:9px 18px;font-size:12.5px;opacity:0;transition:opacity .25s;
    pointer-events:none;max-width:88vw;text-align:center}
  #toast.on{opacity:1}
  .foot{text-align:center;margin:52px 0 0;font-family:'IBM Plex Mono',monospace;
    font-size:9px;letter-spacing:.3em;color:var(--muted);opacity:.65}
  .gate{min-height:100dvh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:16px;text-align:center;padding:30px}
  .gate h1{font-size:22px;font-weight:400;color:var(--ink);margin:0}
  @media(max-width:640px){
    .wrap{padding:0 18px 80px} .hero{padding:48px 18px 24px}
    .hero h1{font-size:23px} .ch h2{font-size:17px;padding-right:66px}
    .sheet .card{max-height:94vh}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bgphoto"></div><div id="bgshade"></div>

<div id="app" class="hidden">
  <header class="hero" id="hero">
    <div class="ph hidden" id="hero-ph"></div>
    <div class="in">
      <p class="ov" id="ov"></p>
      <h1 id="ttl">—</h1>
      <p class="sb" id="sb"></p>
    </div>
  </header>
  <div class="wrap">
    <article class="ch" id="ch">
      <div class="own hidden" id="own"></div>
      <h2 id="ch-t" class="hidden"></h2>
      <div class="bd" id="ch-b"></div>
    </article>
    <div class="nav" id="nav"></div>
    <div class="obar hidden" id="obar"></div>
    <p class="foot" id="foot"></p>
  </div>
</div>

<div id="load" class="gate"><p style="color:var(--muted);font-size:12px">불러오는 중…</p></div>
<div id="gate" class="gate hidden">
  <h1 id="gate-name">—</h1>
  <p style="font-size:12px;color:var(--muted)" id="gate-msg">비밀번호를 입력해 주세요.</p>
  <input type="password" id="gate-pw" style="max-width:240px;text-align:center" placeholder="비밀번호">
  <button class="btn go" id="gate-go">들어가기</button>
  <p style="font-size:11px;color:#e08a8a" id="gate-err"></p>
</div>

<div id="toast"></div>
<script type="module" src="./info.js?v=312"></script>
</body>
</html>
