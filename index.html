<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVERS CLUB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F6F3; --card:#FFFFFF; --ink:#2A2B31; --body:#5C5E66;
    --muted:#9C9EA6; --line:#E8E7E2; --accent:#C2543F; --accent-soft:#F9EFEC;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;min-height:100vh;line-height:1.8}
  a{color:inherit;text-decoration:none}
  button,input,textarea{font-family:inherit;font-size:14px}
  .mono{font-family:'IBM Plex Mono',monospace}
  img{display:block}

  header{display:flex;justify-content:space-between;align-items:center;
    padding:14px 22px;border-bottom:1px solid var(--line);background:var(--card);
    position:sticky;top:0;z-index:10}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand b{font-weight:700}
  .brand .mono{font-size:10px;color:var(--muted);letter-spacing:.2em}
  #topbar-user{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--body)}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);
    border-radius:9px;padding:8px 16px;cursor:pointer}
  .btn:hover{border-color:var(--muted)}
  .btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  .btn.primary:hover{opacity:.85}
  .btn.small{padding:5px 12px;font-size:12px}

  .wrap{max-width:820px;margin:0 auto;padding:34px 18px 80px}
  .hidden{display:none!important}
  .label{font-family:'IBM Plex Mono',monospace;font-size:9px;
    letter-spacing:.35em;color:var(--muted);margin-bottom:12px}

  .center{min-height:60vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:16px}
  .center h1{font-size:22px;font-weight:700;letter-spacing:.04em}
  .center p{font-size:13px;color:var(--body)}
  .field{width:100%;max-width:340px;text-align:left;margin-top:4px}
  .field label{display:block;font-size:11.5px;color:var(--body);margin-bottom:5px}
  .field input{width:100%;padding:11px 13px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg);outline:none}
  .field input:focus{border-color:var(--muted)}
  .hint{font-size:11px;color:var(--muted)}
  .err{font-size:12px;color:var(--accent);min-height:18px}

  /* ── 페이지 ── */
  .banner{height:200px;border-radius:16px;position:relative;overflow:hidden;
    background:linear-gradient(120deg,#E9E4DC,#F3EEE7 45%,#EBE2D8);
    border:1px solid var(--line);background-size:cover;background-position:center}
  .head-row{display:flex;align-items:flex-end;gap:16px;margin:-38px 0 0 26px;position:relative}
  .avatar{width:82px;height:82px;border-radius:50%;overflow:hidden;
    background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;
    font-size:27px;font-weight:700;border:4px solid var(--bg)}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .who .name{font-size:20px;font-weight:700}
  .who .handle{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
  .bio{margin:16px 2px 0;font-size:13.5px;color:var(--body);white-space:pre-wrap}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
  .tag{border:1px solid var(--line);border-radius:999px;padding:4px 13px;
    font-size:12px;color:var(--body);background:var(--card)}

  #widgets{margin-top:24px;display:flex;flex-direction:column;gap:14px}
  .w-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}

  /* 디데이 */
  .dday-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .dday{border:1px solid var(--line);border-radius:13px;padding:14px 16px;background:var(--bg)}
  .dday .n{font-family:'IBM Plex Mono',monospace;font-size:21px;font-weight:500;color:var(--accent)}
  .dday .t{font-size:12px;color:var(--body);margin-top:2px}
  .dday .d{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--muted)}

  /* 커플/캐릭터 칸 */
  .duo{display:flex;gap:18px;align-items:flex-start}
  .duo .ph{width:150px;flex:none;aspect-ratio:3/4;border-radius:12px;overflow:hidden;
    border:1px solid var(--line);background:var(--bg)}
  .duo .ph img{width:100%;height:100%;object-fit:cover}
  .duo .tx h3{font-size:16px;font-weight:700}
  .duo .tx p{margin-top:8px;font-size:13px;color:var(--body);white-space:pre-wrap}
  @media(max-width:560px){.duo{flex-direction:column}.duo .ph{width:100%;aspect-ratio:16/9}}

  /* BGM */
  .bgm-frame{aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
  .bgm-frame iframe{width:100%;height:100%;border:0}
  .bgm-title{margin-top:10px;font-size:12.5px;color:var(--body)}

  /* 소유자 전용 */
  #btn-deco{position:fixed;right:22px;bottom:22px;z-index:40;
    border:none;border-radius:999px;padding:13px 22px;cursor:pointer;
    background:var(--ink);color:#fff;font-size:14px;
    box-shadow:0 10px 24px -10px rgba(42,43,49,.5)}
  .empty-slot{border:1.5px dashed var(--line);border-radius:14px;padding:18px;
    color:var(--muted);font-size:12.5px;text-align:center}

  /* ── 꾸미기 패널 ── */
  #panel{position:fixed;inset:0;background:rgba(30,30,36,.45);
    display:none;align-items:flex-start;justify-content:center;z-index:50;
    padding:30px 14px;overflow:auto}
  #panel.show{display:flex}
  .p-card{background:var(--card);border-radius:18px;width:min(640px,100%);
    padding:26px 24px;position:relative;margin-bottom:40px}
  .p-x{position:absolute;top:16px;right:18px;border:none;background:none;
    cursor:pointer;font-size:15px;color:var(--muted)}
  .p-x:hover{color:var(--ink)}
  .p-sec{border-top:1px solid var(--line);padding:18px 0}
  .p-sec:first-of-type{border-top:none;padding-top:4px}
  .p-sec h4{font-size:13px;font-weight:700;margin-bottom:10px}
  .p-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .p-row input[type=text],.p-row input[type=date],.p-row textarea{
    flex:1;min-width:150px;padding:10px 12px;border:1px solid var(--line);
    border-radius:9px;background:var(--bg);outline:none}
  .p-row textarea{min-height:80px;resize:vertical;width:100%}
  .p-row input:focus,.p-row textarea:focus{border-color:var(--muted)}
  .p-file{font-size:12px;color:var(--body)}
  .p-hint{font-size:11px;color:var(--muted);margin-top:4px}
  .thumb{width:56px;height:56px;border-radius:9px;object-fit:cover;border:1px solid var(--line)}
  .dd-row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
  .dd-row input[type=text]{flex:2;min-width:0}
  .dd-row input[type=date]{flex:1.4;min-width:0}
  .dd-row .rm{border:1px solid var(--line);background:none;border-radius:8px;
    padding:8px 11px;cursor:pointer;color:var(--muted)}
  #p-msg{margin-top:12px;font-size:12px;color:var(--body);min-height:18px}
</style>
</head>
<body>

<header>
  <a class="brand" href="./"><b>LOVERS CLUB</b><span class="mono">v2</span></a>
  <div id="topbar-user"></div>
</header>

<div class="wrap">

  <div id="view-setup" class="center hidden">
    <h1>거의 다 왔어요</h1>
    <p>firebase-config.js에 파이어베이스 설정을 붙여넣어 주세요.</p>
  </div>

  <div id="view-loading" class="center"><p class="mono">LOADING...</p></div>

  <div id="view-login" class="center hidden">
    <h1>LOVERS CLUB</h1>
    <p>지인 전용 갠홈 클럽입니다.<br>초대코드가 있어야 가입할 수 있어요.</p>
    <button class="btn primary" id="btn-login">Google로 계속하기</button>
  </div>

  <div id="view-signup" class="center hidden">
    <h1>클럽 가입</h1>
    <p>초대코드와 페이지 주소를 정해주세요.</p>
    <div class="field"><label>초대코드</label><input id="in-invite"></div>
    <div class="field"><label>페이지 주소 (영문 소문자·숫자·하이픈, 2~20자)</label>
      <input id="in-handle" placeholder="예: syndrome"></div>
    <div class="field"><label>표시 이름</label><input id="in-name"></div>
    <p class="err" id="signup-err"></p>
    <button class="btn primary" id="btn-signup">페이지 만들기</button>
  </div>

  <div id="view-page" class="hidden">
    <div class="banner" id="pg-banner"></div>
    <div class="head-row">
      <div class="avatar" id="pg-avatar">?</div>
      <div class="who">
        <p class="name" id="pg-name">—</p>
        <p class="handle" id="pg-handle">@—</p>
      </div>
    </div>
    <p class="bio" id="pg-bio"></p>
    <div class="tags" id="pg-tags"></div>
    <div id="widgets"></div>
  </div>

</div>

<button id="btn-deco" class="hidden">✎ 꾸미기</button>

<!-- 꾸미기 패널 -->
<div id="panel">
  <div class="p-card">
    <button class="p-x" id="p-close">✕</button>
    <p class="label">DECORATE — 내 페이지 꾸미기</p>

    <div class="p-sec">
      <h4>프로필</h4>
      <div class="p-row"><input type="text" id="e-name" placeholder="표시 이름"></div>
      <div class="p-row"><textarea id="e-bio" placeholder="소개 (여러 줄 가능)"></textarea></div>
      <div class="p-row"><input type="text" id="e-tags" placeholder="태그 (쉼표로 구분 · 예: only ARCH, 드림, CBC open)"></div>
      <div class="p-row" style="align-items:center">
        <img class="thumb hidden" id="e-banner-th">
        <label class="p-file">배너 이미지 <input type="file" id="e-banner" accept="image/*"></label>
      </div>
      <div class="p-row" style="align-items:center">
        <img class="thumb hidden" id="e-avatar-th">
        <label class="p-file">프로필 사진 <input type="file" id="e-avatar" accept="image/*"></label>
      </div>
      <p class="p-hint">이미지는 자동으로 압축돼요. 크게 보이는 배너는 가로로 긴 사진 추천!</p>
    </div>

    <div class="p-sec">
      <h4>디데이</h4>
      <div id="e-ddays"></div>
      <button class="btn small" id="e-dd-add">+ 디데이 추가</button>
    </div>

    <div class="p-sec">
      <h4>커플 설명칸</h4>
      <div class="p-row"><input type="text" id="e-cp-title" placeholder="제목 (예: 제스테 × 유월)"></div>
      <div class="p-row" style="align-items:center">
        <img class="thumb hidden" id="e-cp-th">
        <label class="p-file">이미지 <input type="file" id="e-cp-img" accept="image/*"></label>
      </div>
      <div class="p-row"><textarea id="e-cp-text" placeholder="두 사람 이야기, 관계 요약..."></textarea></div>
    </div>

    <div class="p-sec">
      <h4>캐릭터 단독 소개칸</h4>
      <div class="p-row"><input type="text" id="e-ch-title" placeholder="캐릭터 이름"></div>
      <div class="p-row" style="align-items:center">
        <img class="thumb hidden" id="e-ch-th">
        <label class="p-file">이미지 <input type="file" id="e-ch-img" accept="image/*"></label>
      </div>
      <div class="p-row"><textarea id="e-ch-text" placeholder="설정, 소속, 능력, 소개..."></textarea></div>
    </div>

    <div class="p-sec">
      <h4>BGM</h4>
      <div class="p-row"><input type="text" id="e-bgm-url" placeholder="유튜브 링크 붙여넣기"></div>
      <div class="p-row"><input type="text" id="e-bgm-title" placeholder="곡 제목 · 아티스트 (선택)"></div>
    </div>

    <button class="btn primary" id="p-save" style="width:100%;padding:12px 0">저장</button>
    <p id="p-msg"></p>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
